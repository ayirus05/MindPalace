[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palace"
version = "0.1.0"
description = "MindPalace Tier 2 — local-first semantic memory engine over LanceDB + Ollama"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MindPalace" }]
license = { text = "MIT" }

dependencies = [
    "lancedb>=0.6.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "fastapi>=0.110.0,<0.116.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
palace = "palace.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/palace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["src/palace"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
